<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing David</title>
  </head>
  <body>
    <main>
      <h1>Dancing David</h1>
      <p id="status">Loading pose model…</p>
      <div class="stage">
        <video id="webcam" playsinline muted></video>
        <canvas id="aura"></canvas>
        <canvas id="ribbon-gl"></canvas>
        <canvas id="effects"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <pre id="motion-debug">Speed: 0.00
Direction: NONE
Last event: —</pre>
      <div id="layer-toggles">
        <button type="button" id="toggle-skeleton" aria-pressed="true">Skeleton: ON</button>
        <button type="button" id="toggle-aura" aria-pressed="true">Aura: ON</button>
        <button type="button" id="toggle-energy" aria-pressed="true">Energy Swipe: ON</button>
        <button type="button" id="toggle-tracking" aria-pressed="false">DEBUG TRACKING: OFF</button>
      </div>
      <button id="start" type="button" disabled>Start camera</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
